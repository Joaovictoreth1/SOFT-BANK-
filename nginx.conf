map "$status:$uri" $asset_cache_control {
    default "no-cache";
    "~^(200|304):/assets/[^/]+-[A-Za-z0-9_-]{8}\.[A-Za-z0-9]+$" "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    listen [::]:8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control $asset_cache_control always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
}
